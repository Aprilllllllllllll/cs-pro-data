[project]
name = "cs-pro-data"
version = "0.1.0"
description = "CS 职业选手资料库 - 结构化选手与战队数据，JSON 存储 + Pydantic 校验"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]